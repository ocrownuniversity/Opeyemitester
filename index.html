const ADMIN_EMAIL="oladejiridwanopeyemi@gmail.com";

const dbp=new Promise((r,j)=>{const q=indexedDB.open('exampilot',1);q.onupgradeneeded=()=>['q','m','a','s'].forEach(n=>q.result.createObjectStore(n,{keyPath:'id'}));q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const tx=async(s,m,f)=>{const d=await dbp;return new Promise((res,rej)=>{const t=d.transaction(s,m);const r=f(t.objectStore(s));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
const all=s=>tx(s,'readonly',o=>o.getAll()),get=(s,k)=>tx(s,'readonly',o=>o.get(k)),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k)),putMany=(s,a)=>tx('readwrite'&&s,'readwrite',o=>{a.forEach(v=>o.put(v))});

    const[a,au,f]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);

      if(u){try{const r=f.doc(fb.db,'users',u.uid),d=await f.getDoc(r);
        if(d.exists())role=d.data().role||'';else await f.setDoc(r,{email:u.email,role:'student',at:Date.now()})}catch{}

        sync()}

  }catch{toast('Cloud unavailable (offline mode)')}
}
async function sync(){
  if(!fb||!user||!navigator.onLine)return;
  try{const{f,db}=fb,col=f.collection(db,'users',user.uid,'attempts'),A=await all('a'),r=await f.getDocs(col),have=new Set(),n=[];
    r.forEach(d=>have.add(d.id));
    for(const a of A)if(!have.has(a.id))await f.setDoc(f.doc(col,a.id),{...a,uid:user.uid,synced:1});
    const ids=new Set(A.map(a=>a.id));r.forEach(d=>{if(!ids.has(d.id))n.push({...d.data(),synced:1})});

}
/* ---------- Downloads ---------- */
async function dl(exam){
  if(!fb||!navigator.onLine)return toast('Need internet and Firebase config');
  toast('Downloading '+N[exam]+'…');
  try{const{f,db}=fb,s=await f.getDocs(f.query(f.collection(db,'questions'),f.where('exam','==',exam),f.where('status','==','published')));
    const a=s.docs.map(d=>({...d.data(),id:d.id})),old=await qs(exam);
    await tx('q','readwrite',o=>{old.forEach(q=>o.delete(q.id));a.forEach(q=>o.put(q))});
    await put('m',{id:exam,n:a.length,at:Date.now(),ok:1});toast(a.length+' questions saved offline')
  }catch(e){toast('Download failed/incomplete: '+(e.name=='QuotaExceededError'?'storage full':e.code||e.message))}
  if(view=='dl')downloads();if(view=='prac')setup()
}
W.dl=d=>dl(d.v);W.rm=async d=>{if(!confirm('Remove download?'))return;const o=await qs(d.v);await tx('q','readwrite',s=>{o.forEach(q=>s.delete(q.id))});await del('m',d.v);downloads()};
W.dall=async()=>{for(const e of Object.keys(N))await dl(e)};
async function downloads(){view='dl';nav();const M=Object.fromEntries((await all('m')).map(m=>[m.id,m]));let st='';
  try{const e=await navigator.storage.estimate();st=`Storage used: ${(e.usage/1048576).toFixed(1)} MB of ${(e.quota/1048576|0)} MB`}catch{}
  $('#app').innerHTML=`<h2>Download Manager</h2><p class=m>Installing the app does not download questions. Download each exam you need for offline study. ${st}</p>`+
  Object.keys(N).map(e=>{const m=M[e];return`<div class=card><b>${N[e]}</b><br><span class=m>${m&&m.ok?`✔ Available offline · ${m.n} questions · updated ${new Date(m.at).toLocaleDateString()}`:'Not downloaded'}</span><div><button class=pr data-a=dl data-v=${e}>${m?'Update':'Download'}</button>${m?`<button data-a=rm data-v=${e}>Remove</button>`:''}</div></div>`}).join('')+`<button class=pr data-a=dall>Download all</button>`}
/* ---------- Stats / Home ---------- */
function stats(A){const sub={},top={},days=new Set(),td=new Date().toDateString();let tq=0,today=0;
  A.forEach(a=>{days.add(new Date(a.at).toDateString());(a.det||[]).forEach(d=>{tq++;if(new Date(a.at).toDateString()==td)today++;
    const x=sub[d.s]??={c:0,t:0};x.t++;x.c+=d.c;const k=d.s+' · '+(d.tp||'General'),y=top[k]??={c:0,t:0,s:d.s,tp:d.tp};y.t++;y.c+=d.c})});
  let st=0,dt=new Date();while(days.has(dt.toDateString())){st++;dt.setDate(dt.getDate()-1)}
  const p=A.map(a=>a.pct);return{tq,today,sub,top,st,n:A.length,avg:p.length?Math.round(p.reduce((a,b)=>a+b)/p.length):0,best:p.length?Math.max(...p):0}}
async function home(){view='home';nav();const A=(await all('a')).sort((a,b)=>b.at-a.at),s=stats(A),cur=await get('s','cur');
  const weak=Object.values(s.top).filter(t=>t.t>=3).map(t=>({...t,p:Math.round(t.c/t.t*100)})).sort((a,b)=>a.p-b.p).slice(0,3);
  $('#app').innerHTML=`<div class=card><h1>Welcome${user?', '+E(user.displayName||user.email.split('@')[0]):''} 👋</h1><span class=m>${navigator.onLine?'🟢 Online':'🔴 Offline — downloaded questions still work'}</span><br>
  ${cur?`<button class=pr data-a=res>▶ Continue studying</button>`:`<button class=pr data-a=nv data-v=prac>Start practising</button>`}</div>
  <div class=g3>${Object.keys(N).map(e=>`<div class=card><b>${N[e]}</b><br><button data-a=ex data-v=${e}>Open</button></div>`).join('')}</div>
  <div class=card><div class=row><div><div class=big>${s.tq}</div><span class=m>Questions</span></div><div><div class=big>${s.n}</div><span class=m>Sessions</span></div><div><div class=big>${s.avg}%</div><span class=m>Average</span></div><div><div class=big>${s.best}%</div><span class=m>Best</span></div><div><div class=big>🔥${s.st}</div><span class=m>Day streak</span></div></div>
  <p>Daily goal: ${Math.min(s.today,20)}/20 questions</p><div class=bar><i style="width:${Math.min(100,s.today*5)}%"></i></div></div>
  ${weak.length?`<div class=card><b>Recommended revision</b>${weak.map(t=>`<div class=row><span>${E(t.s)} · ${E(t.tp||'General')} (${t.p}%)</span><button data-a=rec data-s="${E(t.s)}" data-t="${E(t.tp||'')}">Practise</button></div>`).join('')}</div>`:''}
  <div class=card><b>Subject performance</b>${Object.entries(s.sub).map(([k,v])=>`<div>${E(k)} ${Math.round(v.c/v.t*100)}%<div class=bar><i style="width:${v.c/v.t*100}%"></i></div></div>`).join('')||'<p class=m>No attempts yet.</p>'}</div>
  <div class=card><b>Recent results</b>${A.slice(0,6).map(a=>`<div class=row><span>${N[a.exam]} ${a.mode} · ${new Date(a.at).toLocaleDateString()}</span><button data-a=hi data-v=${a.id}>${a.pct}% ›</button></div>`).join('')||'<p class=m>Nothing yet.</p>'}</div>`}
W.nv=d=>go(d.v);W.ex=d=>{S.sel={exam:d.v,mode:'topic',subs:[],n:10,timed:false,min:60,fb:true};go('prac')};
W.rec=async d=>{const x=S.sel={exam:'',mode:'topic',subs:[d.s],topic:d.t,n:10,fb:true},Q=(await all('q')).filter(q=>q.subject==d.s&&(q.topic||'')==d.t);
  if(!Q.length)return toast('Download questions first');x.exam=Q[0].exam;begin(shuf(Q).slice(0,10),x)};
/* ---------- Practice setup ---------- */
async function setup(){view='prac';nav();const x=S.sel??={exam:'JAMB',mode:'topic',subs:[],n:10,timed:false,min:60,fb:true},Q=await qs(x.exam);
  const subs=[...new Set(Q.map(q=>q.subject))].sort(),sQ=Q.filter(q=>q.subject==x.subs[0]);

  let h=`<h2>Practice</h2><div class=card><b>1. Examination</b><br>${chips('exam',Object.entries(N),v=>x.exam==v)}</div>`;

  else{h+=`<div class=card><b>2. Activity</b><br>${chips('mode',[['past','Past Questions'],['topic','Topic Practice'],['mock','Mock Exam']],v=>x.mode==v)}</div>

  if(x.mode=='past'&&x.subs[0])h+=`<div class=card><b>Year</b><br>${chips('year',[...new Set(sQ.map(q=>q.year).filter(Boolean))].sort().reverse().map(y=>[String(y),String(y)]),v=>x.year==v)}</div>`;
  if(x.mode=='topic'&&x.subs[0])h+=`<div class=card><b>Topic</b><br>${chips('topic',[...new Set(sQ.map(q=>q.topic).filter(Boolean))].sort().map(t=>[t,t]),v=>x.topic==v)}<br><b>Questions</b><br>${chips('n',[10,20,30].map(n=>[n,n]),v=>x.n==v)}</div>`;
  if(x.mode=='mock')h+=`<div class=card><b>Questions per subject</b><input id=pc type=number value=20 min=1><p class=m>ExamPilot practice mock — not an official exam structure. Set counts/duration as you wish.</p></div>`;
  h+=`<div class=card><button class="${x.timed?'on':''}" data-a=T data-k=timed>⏱ Timed</button>${x.mode!='mock'?`<button class="${x.fb?'on':''}" data-a=T data-k=fb>Show answers as I go</button>`:''}
  ${x.timed?`<br>Minutes <input id=mn type=number value=${x.min} min=1>`:''}</div><button class=pr data-a=go>Begin</button>`}
  $('#app').innerHTML=h}
W.P=d=>{const x=S.sel;let v=d.v;
  if(d.k=='subs'){x.subs=x.mode=='mock'&&x.exam=='JAMB'?(x.subs.includes(v)?x.subs.filter(y=>y!=v):x.subs.length<4?[...x.subs,v]:x.subs):[v];x.year=x.topic=null}
  else{x[d.k]=d.k=='n'?+v:v;if(d.k=='exam'||d.k=='mode'){x.subs=[];x.year=x.topic=null}}setup()};
W.T=d=>{S.sel[d.k]=!S.sel[d.k];setup()};
W.go=async()=>{const x=S.sel,Q=await qs(x.exam);let L=[];if(!x.subs.length)return toast('Pick a subject');x.min=+($('#mn')?.value)||60;
  if(x.mode=='past'){if(!x.year)return toast('Pick a year');L=Q.filter(q=>q.subject==x.subs[0]&&q.year==x.year).sort((a,b)=>(a.no||0)-(b.no||0))}
  else if(x.mode=='topic'){if(!x.topic)return toast('Pick a topic');L=shuf(Q.filter(q=>q.subject==x.subs[0]&&q.topic==x.topic)).slice(0,x.n)}
  else{const n=+$('#pc').value||20;x.subs.forEach(s=>L.push(...shuf(Q.filter(q=>q.subject==s)).slice(0,n)))}
  if(!L.length)return toast('No questions available');begin(L,x)};
/* ---------- Session / Quiz ---------- */
function begin(L,x,min){min=min??(x.timed?x.min:0);
  sess={id:'cur',aid:(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random()),exam:x.exam,mode:x.mode,Q:L,ans:{},fl:{},i:0,fb:x.mode!='mock'&&x.fb,min,timed:!!min,deadline:min?Date.now()+min*60000:0,start:Date.now()};
  persist();quiz()}
W.res=async()=>{sess=await get('s','cur');if(sess)quiz()};
function quiz(){clearInterval(tick);view='quiz';nav();const s=sess,q=s.Q[s.i],a=s.ans[q.id],lock=s.fb&&a!=null,mock=s.mode=='mock';
  $('#app').innerHTML=`<div class=card><div class=row><b>${s.i+1}/${s.Q.length} · ${E(q.subject)}</b>${s.timed?'<b id=tm></b>':'<span class=m>Untimed</span>'}</div><div class=bar><i style="width:${(s.i+1)/s.Q.length*100}%"></i></div>
  ${q.passage?`<p class=ps>${E(q.passage)}</p>`:''}${q.img?`<img src="${E(q.img)}" alt="" style="max-width:100%">`:''}<h3>${E(q.text)}</h3>${q.formula?`<code>${E(q.formula)}</code>`:''}
  ${q.options.map((o,j)=>{let c=a===j?' sel':'';if(lock){if(j===q.answer)c+=' ok';else if(a===j)c+=' bad'}return`<button class="opt${c}" data-a=pk data-v=${j}>${L8[j]}. ${E(o)}</button>`}).join('')}
  ${lock?`<p class=ex><b>${a===q.answer?'Correct ✔':'Correct answer: '+L8[q.answer]}</b><br>${E(q.explanation||'')}</p>`:''}
  <div class=row><button data-a=mv data-v=-1 ${s.i?'':'disabled'}>◀ Prev</button>${mock?`<button data-a=fl>${s.fl[q.id]?'★ Marked':'☆ Mark'}</button>`:''}

  if(s.timed){const t=()=>{const r=s.deadline-Date.now(),el=$('#tm');if(el)el.textContent='⏱ '+fmt(r);if(r<=0)finish()};t();tick=setInterval(t,500)}}

async function finish(){const s=sess;if(!s||s.done)return;s.done=1;clearInterval(tick);let sc=0,mx=0,c=0,w=0,u=0;const bs={},det=[];

    if(a==null)u++;else if(ok){c++;sc+=m;b.sc+=m;b.c++}else w++;det.push({id:q.id,s:q.subject,tp:q.topic||'',c:ok?1:0,a:a??null})});

function result(at,Q,f='all'){S.r={at,Q};view='result';nav();const dm=Object.fromEntries(at.det.map(d=>[d.id,d]));

  ${R.map(q=>{const d=dm[q.id];return`<div class=card><b>${E(q.subject)}</b> ${q.passage?`<p class=ps>${E(q.passage)}</p>`:''}<p>${E(q.text)}</p>

W.rf=d=>result(S.r.at,S.r.Q,d.v);W.ag=()=>{const{at,Q}=S.r;begin(Q,{exam:at.exam,mode:at.mode,fb:true},at.tm)};

const lib=(u,t)=>window[t]?0:new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=()=>j(Error('Could not load '+t+' (internet needed)'));document.head.appendChild(s)});

const nk=k=>String(k).toLowerCase().replace(/[^a-z0-9]/g,''),nt=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,300);
const hash=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)+s.length};
const dk=q=>[q.exam,q.year||'',String(q.subject||'').toLowerCase(),nt(q.text)].join('|');
const sv=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()};

W.tpl=d=>ae(async()=>{await needX();const ex={exam:'WAEC',year:2019,subject:'Example Subject',topic:'Example Topic',passage:'',question:'EXAMPLE ROW - DELETE ME: What is 2 + 2?',optionA:'3',optionB:'4',optionC:'5',optionD:'6',answer:'B',explanation:'2 + 2 = 4',marks:1,image:'',formula:'',source:'Your source'},ws=XLSX.utils.json_to_sheet([ex],{header:COLS});

async function readFile(file){const n=file.name.toLowerCase();if(file.size>25*1048576)throw Error('File too large (max 25 MB)');
  if(n.endsWith('.json')){const j=JSON.parse(await file.text());return{rows:Array.isArray(j)?j:j.questions,j:1}}
  await needX();const wb=n.endsWith('.csv')?XLSX.read(await file.text(),{type:'string'}):XLSX.read(await file.arrayBuffer(),{type:'array'});
  return{rows:XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}),j:0}}
async function readZip(file){if(file.size>60*1048576)throw Error('ZIP too large (max 60 MB)');await needZ();const z=await JSZip.loadAsync(file),ents=Object.values(z.files).filter(e=>!e.dir);
  if(ents.length>3000)throw Error('Too many files in ZIP');
  const ok=e=>!/(^|\/)\.\.(\/|$)|^\/|\\|:|^__MACOSX\/|(^|\/)\./.test(e.name),imgs={};let data=null;
  for(const e of ents){if(!ok(e))continue;const b=e.name.split('/').pop().toLowerCase();if(/\.(png|jpe?g|gif|webp)$/.test(b))imgs[b]=e;else if(!data&&/\.(json|csv|xlsx)$/.test(b))data=e}
  if(!data)throw Error('No .json, .csv or .xlsx data file found in the ZIP');
  if(data._data&&data._data.uncompressedSize>25*1048576)throw Error('Data file too large');
  const d=await readFile(new File([await data.async('blob')],data.name.split('/').pop()));d.imgs=imgs;return d}
async function pic(e){if(e._data&&e._data.uncompressedSize>3*1048576)throw Error('Image over 3 MB: '+e.name);const bm=await createImageBitmap(await e.async('blob')),s=Math.min(1,800/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
  const u=c.toDataURL('image/jpeg',.75);if(u.length>700000)throw Error('Image too detailed: '+e.name);return u}
function norm(r,j){const o={};for(const k in r)o[nk(k)]=r[k];const g=(...n)=>{for(const x of n){const v=o[x];if(v!=null&&String(v).trim()!=='')return String(v).trim()}return''},e=[];
  const u=g('exam','examination','examtype').toUpperCase(),exam=/JAMB|UTME/.test(u)?'JAMB':/WAEC/.test(u)?'WAEC':/NECO/.test(u)?'NECO':'';if(!exam)e.push('exam must be WAEC, NECO or JAMB');
  const text=g('question','text','questiontext'),subject=g('subject');if(!text)e.push('question missing');if(!subject)e.push('subject missing');
  const ys=g('year');let year=null;if(ys){year=+ys;if(!Number.isInteger(year)||year<1980||year>2100){e.push('invalid year');year=null}}
  let options=Array.isArray(r.options)?r.options.map(x=>String(x??'').trim()):[...'ABCDEFGH'].map(l=>g('option'+l.toLowerCase(),l.toLowerCase()));
  let n=0;options.forEach((x,i)=>{if(x)n=i+1});options=options.slice(0,n);if(n<2)e.push('need at least 2 options');else if(options.includes(''))e.push('gap in options');
  const a=g('answer','correct','correctanswer','correctoption');let answer=-1;if(/^[A-Ha-h]$/.test(a))answer=a.toUpperCase().charCodeAt(0)-65;else if(j&&/^\d+$/.test(a))answer=+a;
  if(answer<0||answer>=options.length)e.push('answer must be a letter matching an option (A, B, C…)');
  const mk=g('marks','mark'),marks=mk?+mk:1;if(!(marks>0))e.push('invalid marks');
  return{e,rec:{exam,year,subject,topic:g('topic'),passage:g('passage'),text,options,answer,explanation:g('explanation','explain'),marks:marks>0?marks:1,img:'',_img:g('image','img','diagram'),formula:g('formula','math'),source:g('source'),no:+g('no','number','questionnumber')||null}}}
async function prepare(rows,j,imgs){const ex=new Set((S.exq||[]).map(dk)),seen=new Set(),P={ok:[],err:[],dup:[]},cache={};
  for(let i=0;i<rows.length;i++){const n=i+1;if(!rows[i]||typeof rows[i]!='object'){P.err.push({n,e:['not a valid record']});continue}
    const{e,rec}=norm(rows[i],j),u=rec._img;delete rec._img;
    if(u){if(/^https?:\/\//i.test(u))rec.img=u;else if(!imgs)e.push('image file name needs a ZIP upload (or use an https link)');
      else{const k=u.split(/[\\/]/).pop().toLowerCase(),en=imgs[k];if(!en)e.push('image not found in ZIP: '+k);else try{rec.img=cache[k]??=await pic(en)}catch(x){e.push(x.message)}}}
    if(e.length){P.err.push({n,e});continue}
    const key=dk(rec);if(ex.has(key)||seen.has(key)){P.dup.push({n});continue}seen.add(key);rec.id='q'+hash(key);rec.n=n;P.ok.push(rec)}
  return P}

  (P.dup.length?`<p class=m>Duplicate rows: ${P.dup.slice(0,10).map(x=>x.n).join(', ')}${P.dup.length>10?'…':''}</p>`:'')+
